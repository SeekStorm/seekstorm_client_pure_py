name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write  

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flit

    - name: Build Package
      run: flit build

    - name: Publish to PyPI
      uses: pypa/jwt-publisher-action@main
      with:
        packages-dir: dist/
